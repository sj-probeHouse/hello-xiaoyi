name: Windows tests and portable build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --cov=xiaoyi --cov-report=term-missing --cov-report=xml
      - run: python scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: HelloXiaoyi-windows-x64
          path: dist/HelloXiaoyi-*-windows-x64.zip
          retention-days: 14
