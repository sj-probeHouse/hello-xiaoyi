[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-xiaoyi"
version = "0.1.2"
description = "你好，小译 — Windows 全局英译中与英文朗读助手"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7",
  "httpx>=0.28,<1",
  "edge-tts>=7.2,<8",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11", "pyinstaller>=6.15,<7"]

[tool.setuptools.packages.find]
include = ["xiaoyi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
